name: Branch Autofix

on:
  push:
    branches:
      - work/full-v030-entities

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/full-v030-entities
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff>=0.13.2,<1"
      - run: ruff check . --fix
      - run: ruff format custom_components tests
      - name: Commit autofixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests
          git commit -m "Apply Ruff autofixes"
          git push origin HEAD:work/full-v030-entities
