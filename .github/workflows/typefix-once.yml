name: Toolkit Typefix Once

on:
  push:
    branches:
      - work/full-v030-entities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/full-v030-entities
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('custom_components/shelly_toolkit/device_manager.py')
          s = p.read_text()
          s = s.replace('from typing import Any\n', 'from collections.abc import Callable\nfrom typing import Any\n', 1)
          s = s.replace(
              '        self._remote_ids: set[str] = set()\n',
              '        self._remote_ids: set[str] = set()\n        self._component_listeners: set[Callable[[ToolkitDevice], None]] = set()\n',
              1,
          )
          s = s.replace(
              '        transport.set_event_callback(\n            lambda frame, target=device_id: self.async_handle_frame(target, frame)\n        )',
              '        transport.set_event_callback(self._event_callback(device_id))',
          )
          s = s.replace(
              '            self._sync_registry(device)\n        except RpcError as err:',
              '            self._sync_registry(device)\n            self._notify_components(device)\n        except RpcError as err:',
              1,
          )
          marker = '    async def async_call(\n'
          insert = '''    def async_add_component_listener(\n        self, callback: Callable[[ToolkitDevice], None]\n    ) -> Callable[[], None]:\n        """Subscribe to component discovery and replay current devices."""\n        self._component_listeners.add(callback)\n        for device in self.devices.values():\n            if device.status or device.capabilities.components:\n                callback(device)\n        return lambda: self._component_listeners.discard(callback)\n\n    def _notify_components(self, device: ToolkitDevice) -> None:\n        """Notify entity platforms after a component snapshot or push update."""\n        for callback in tuple(self._component_listeners):\n            callback(device)\n\n    def _event_callback(self, device_id: str) -> EventCallback:\n        """Build a typed push callback bound to one Toolkit target."""\n        async def handle(frame: dict[str, Any]) -> None:\n            await self.async_handle_frame(device_id, frame)\n\n        return handle\n\n'''
          if insert not in s:
              s = s.replace(marker, insert + marker, 1)
          s = s.replace(
              '        for event in self.events.add_frame(device_id, frame):\n',
              '        if method in {"NotifyStatus", "NotifyFullStatus", "NotifyConfig", "NotifyFullConfig"}:\n            self._notify_components(device)\n        for event in self.events.add_frame(device_id, frame):\n',
              1,
          )
          p.write_text(s)

          p = Path('custom_components/shelly_toolkit/restore.py')
          s = p.read_text()
          s = s.replace(
              '            if item.status is not RestoreStatus.READY or item.method is None:\n                results.append(item)\n                continue\n',
              '            if (\n                item.status is not RestoreStatus.READY\n                or item.method is None\n                or item.params is None\n            ):\n                results.append(item)\n                continue\n',
              1,
          )
          p.write_text(s)

          for name in ('switch.py', 'sensor.py', 'binary_sensor.py', 'light.py', 'cover.py'):
              p = Path('custom_components/shelly_toolkit') / name
              s = p.read_text()
              needle = '    discover()\n    entry.async_on_unload(runtime.coordinator.async_add_listener(discover))\n'
              repl = ('    discover()\n'
                      '    entry.async_on_unload(\n'
                      '        runtime.manager.async_add_component_listener(lambda _device: discover())\n'
                      '    )\n'
                      '    entry.async_on_unload(runtime.coordinator.async_add_listener(discover))\n')
              s = s.replace(needle, repl, 1)
              p.write_text(s)
          PY
      - run: python -m pip install "ruff>=0.13.2,<1" "mypy>=1.18.2,<2"
      - run: ruff check . --fix
      - run: ruff format custom_components tests
      - name: Commit targeted fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Toolkit entity typing and immediate discovery"
          git push origin HEAD:work/full-v030-entities
