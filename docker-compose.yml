services:
  relay:
    build: ./relay
    restart: unless-stopped
    environment:
      BRIDGE_SITE_ID: ${BRIDGE_SITE_ID}
      BRIDGE_DEVICE_TOKEN: ${BRIDGE_DEVICE_TOKEN}
      BRIDGE_HA_TOKEN: ${BRIDGE_HA_TOKEN}
      BRIDGE_SITES_JSON: ${BRIDGE_SITES_JSON:-}
      BRIDGE_ALLOW_DANGEROUS_RPC: ${BRIDGE_ALLOW_DANGEROUS_RPC:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
